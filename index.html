<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e79">
  <title>簿記2級 学習</title>
  <style>
    :root { --bg: #f6f7f9; --fg: #1d232b; --muted: #5d6773; --accent: #1f4e79; --card: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14181d; --fg: #e8ebef; --muted: #9aa4af; --accent: #7fb2e5; --card: #1d232b; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      padding: 16px;
    }
    main { background: var(--card); border-radius: 16px; padding: 28px 24px; max-width: 420px; width: 100%; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 1.4rem; color: var(--accent); }
    p { margin: 8px 0; line-height: 1.7; color: var(--muted); }
    #meta { font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>簿記2級 学習アプリ</h1>
    <p>準備中です。Phase 1 で記録機能が使えるようになります。</p>
    <p id="meta"></p>
  </main>
  <script type="module">
    // データの読み込み経路（相対パス）が Pages 上で通ることを確かめる
    try {
      const [config, plan] = await Promise.all([
        fetch('./data/config.json').then(r => r.json()),
        fetch('./data/plan.json').then(r => r.json()),
      ]);
      document.getElementById('meta').textContent =
        `プラン${config.plan}・全${plan.weeks.length}週・受験予定 ${config.examDate}`;
    } catch {
      document.getElementById('meta').textContent = '設定の読み込みに失敗しました';
    }
  </script>
</body>
</html>
